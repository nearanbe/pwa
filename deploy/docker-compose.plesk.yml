# Plesk'li sunucu için: cd deploy && docker compose -f docker-compose.plesk.yml --env-file ../.env up -d --build
# HTTPS ve alan adı yönlendirmesini Plesk'in nginx'i yapar; konteynerler yalnızca sunucunun içinden erişilebilir.
services:
  site:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - site-data:/app/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=Europe/Istanbul
      - TZ=Europe/Istanbul
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RUNNERS_ENABLED=true
      # Akışların kullandığı değişkenler
      - SITE_URL=http://site:3000
      - SITE_API_TOKEN=${API_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - FB_PAGE_ID=${FB_PAGE_ID}
      - FB_PAGE_TOKEN=${FB_PAGE_TOKEN}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - site

volumes:
  site-data:
  n8n-data:
